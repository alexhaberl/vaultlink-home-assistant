[project]
name = "vaultlink-home-assistant"
version = "0.1.0"
description = "Read-only VaultLink monitoring integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Alexander Haberl" }]
dependencies = []

[tool.setuptools]
packages = []

[project.optional-dependencies]
test = [
  "homeassistant==2026.8.3",
  "mypy==1.18.2",
  "pytest==9.0.3",
  "pytest-aiohttp==1.1.1",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.357",
  "ruff==0.13.3",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.vaultlink --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "DTZ", "E", "F", "I", "PT", "RUF", "S", "SIM", "UP"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "PLR2004", "S101", "S105", "S106", "SLF001"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests"]
